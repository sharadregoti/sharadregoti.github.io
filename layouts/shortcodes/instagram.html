{{- /* Instagram embed without the API token that Hugo < 0.123's built-in shortcode requires. Usage: {{< instagram POST_ID >}} */ -}}
{{- $id := .Get 0 -}}
<blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="https://www.instagram.com/p/{{ $id }}/" data-instgrm-version="14" style="background:#fff; border:0; border-radius:3px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin:1px auto 16px; max-width:540px; min-width:326px; padding:0; width:calc(100% - 2px);">
  <a href="https://www.instagram.com/p/{{ $id }}/" target="_blank" rel="noopener">View this post on Instagram</a>
</blockquote>
{{- if not (.Page.Scratch.Get "instagramScript") }}
{{- .Page.Scratch.Set "instagramScript" true }}
<script async src="https://www.instagram.com/embed.js"></script>
{{- end }}
